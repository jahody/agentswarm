  key_env: NVIDIA_NIM_KEY
  quota_endpoint: null
  quota_strategy: opaque
  request_timeout: 120
  data_used_for_training: false
  notes: |
    cold-start can exceed 60s (glm-5.3-flash and gemma-4-31b-it took ~40s on first call);
    opaque quota; monthly credit budget visible only in dashboard
