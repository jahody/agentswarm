# Catalog refreshed 2026-10-20 against each provider's live /models plus a one-request
# probe per model; most ids from the 2026-05-03 cleanup had been retired by then.
# Tiers for ids added on 2026-10-20 are provisional (no capsniff run yet).
# Removed: deepseek (402, no signup credit), moonshot (suspended at $0).
# Each model entry: {id, tier} where tier in {T1, T2, T3}.
# T1 = high reasoning, T2 = general, T3 = fast/cheap.
# `disabled_models`: permanently dropped IDs (404/410/gated/retired). Kept for audit.
# `strengths`: capability labels — reasoning, coding, agentic, fast, multilingual, general.
# Catalogs drift fast: run `python bank.py --discover` before relying on this list.

- name: cerebras
  base_url: https://api.cerebras.ai/v1
  key_env: CEREBRAS_KEY
  quota_endpoint: null
  quota_strategy: headers
  request_timeout: 30
  data_used_for_training: false
  notes: |
    rich x-ratelimit-{limit,remaining}-{requests,tokens}-{minute,hour,day}.
    2026-10-20: every model answered 402 "payment required" (billing tab) for our
    account, so the free tier may now need billing set up. Bank cools 402 down 24 h.
  models:
    - {id: gpt-oss-120b,  tier: T1, strengths: [general, reasoning]}
    - {id: qwen-3.8-27b,  tier: T3, strengths: [fast, general]}
  disabled_models:
    - {id: llama3.1-8b,                     reason: "retired; missing from /models 2026-10"}
    - {id: qwen-3-235b-a22b-instruct-2507,  reason: "retired; missing from /models 2026-10"}
    - {id: zai-glm-4.7,     reason: "404 access gated"}
    - {id: llama-3.3-70b,   reason: "stale id (renamed)"}
    - {id: qwen-3-32b,      reason: "stale id"}
    - {id: deepseek-r1-distill-llama-70b, reason: "stale id"}

- name: groq
  base_url: https://api.groq.com/openai/v1
  key_env: GROQ_KEY
  quota_endpoint: null
  quota_strategy: headers
  request_timeout: 30
  data_used_for_training: false
  notes: per-model RPM/TPM in headers; window inferred from reset interval
  models:
    - {id: openai/gpt-oss-120b,  tier: T1, strengths: [general, reasoning]}
    - {id: openai/gpt-oss-20b,   tier: T2, strengths: [general]}
    - {id: qwen/qwen3.8-27b,     tier: T3, strengths: [fast, multilingual]}
  disabled_models:
    - {id: llama-3.3-70b-versatile,                   reason: "retired; missing from /models 2026-10"}
    - {id: llama-3.1-8b-instant,                      reason: "retired; missing from /models 2026-10"}
    - {id: qwen/qwen3-32b,                            reason: "retired; missing from /models 2026-10"}
    - {id: meta-llama/llama-4-scout-17b-16e-instruct, reason: "retired; missing from /models 2026-10"}
    - {id: qwen-qwq-32b,                  reason: "decommissioned"}
    - {id: deepseek-r1-distill-llama-70b, reason: "decommissioned"}
    - {id: moonshotai/kimi-k2-instruct,   reason: "not hosted by Groq"}

- name: google_ai_studio
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  key_env: GOOGLE_AI_STUDIO_KEY
  quota_endpoint: null
  quota_strategy: opaque
  request_timeout: 30
  data_used_for_training: true
  notes: opaque on free tier; local bucket from documented limits; 429 body authoritative
  models:
    - {id: gemini-2.5-flash,      tier: T2, doc_rpm: 10,  doc_rpd: 250,   doc_tpm: 1000000, strengths: [general, multilingual]}
    - {id: gemini-2.5-flash-lite, tier: T3, doc_rpm: 30,  doc_rpd: 14000, doc_tpm: 1000000, strengths: [fast, multilingual]}
    - {id: gemini-3.5-flash,      tier: T1, strengths: [reasoning, general]}
    - {id: gemini-3.5-flash-lite, tier: T3, strengths: [fast, multilingual]}
  disabled_models:
    - {id: gemini-2.5-pro, reason: "limit:0 on free tier (paid only)"}

- name: sambanova
  base_url: https://api.sambanova.ai/v1
  key_env: SAMBANOVA_KEY
  quota_endpoint: null
  quota_strategy: headers
  request_timeout: 30
  data_used_for_training: false
  notes: |
    20 RPD per model only; no RPM/TPM headers; soft-throttle locally.
    2026-10-20: ids below are from the live /models; not probed (our key had expired).
  models:
    - {id: Meta-Llama-3.3-70B-Instruct, tier: T2, doc_rpd: 20, strengths: [general, multilingual]}
    - {id: DeepSeek-V3.2,               tier: T1, doc_rpd: 20, strengths: [coding, general]}
    - {id: DeepSeek-V3.1,               tier: T1, doc_rpd: 20, strengths: [coding, general]}
    - {id: gpt-oss-120b,                tier: T1, doc_rpd: 20, strengths: [general, reasoning]}
    - {id: MiniMax-M3,                  tier: T2, doc_rpd: 20, strengths: [general]}
    - {id: gemma-4-31B-it,              tier: T3, doc_rpd: 20, strengths: [fast, multilingual]}
  disabled_models:
    - {id: Llama-4-Maverick-17B-128E-Instruct, reason: "retired; missing from /models 2026-10"}
    - {id: gemma-3-12b-it,                     reason: "retired; missing from /models 2026-10"}
    - {id: DeepSeek-R1, reason: "410 deprecated; use V3.2"}

- name: nvidia_nim
