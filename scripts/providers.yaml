    - {id: nvidia/nemotron-3-ultra-550b-a55b,             tier: T1, strengths: [reasoning, general]}
    - {id: nvidia/nemotron-3-super-120b-a12b,             tier: T1, strengths: [reasoning, agentic]}
    - {id: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning, tier: T1, strengths: [reasoning, fast]}
    - {id: openai/gpt-oss-20b,                            tier: T2, strengths: [general]}
    - {id: z-ai/glm-5.3-flash,                            tier: T2, strengths: [multilingual, coding]}
    - {id: google/gemma-4-31b-it,                         tier: T2, strengths: [general, multilingual]}
  disabled_models:
    - {id: moonshotai/kimi-k2-instruct,              reason: "retired; missing from /models 2026-10"}
    - {id: moonshotai/kimi-k2-thinking,              reason: "retired; missing from /models 2026-10"}
    - {id: meta/llama-3.3-70b-instruct,              reason: "retired; missing from /models 2026-10"}
    - {id: deepseek-ai/deepseek-v4-pro,              reason: "retired; missing from /models 2026-10"}
    - {id: deepseek-ai/deepseek-v4-flash,            reason: "retired; missing from /models 2026-10"}
    - {id: openai/gpt-oss-120b,                      reason: "retired; missing from /models 2026-10"}
    - {id: qwen/qwen3-next-80b-a3b-instruct,         reason: "retired; missing from /models 2026-10"}
    - {id: nvidia/llama-3.3-nemotron-super-49b-v1.5, reason: "retired; missing from /models 2026-10"}
    - {id: z-ai/glm5,                                reason: "retired; missing from /models 2026-10"}
    - {id: moonshotai/kimi-k2.6,                     reason: "404 function not found for account (2026-10)"}
    - {id: mistralai/mistral-large-2-instruct,       reason: "404 function not found for account (2026-10)"}
